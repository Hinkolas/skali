name: skali-development

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: skali
    ports:
      - "127.0.0.1:${SKALI_DEV_DB_PORT:-55432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d skali"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
