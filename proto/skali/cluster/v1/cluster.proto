// The skali control plane: daemon-to-daemon only, never exposed to CLI/web
// clients (those use the REST API). Trust model:
//
//   - EnrollmentService runs on the MASTER's TLS listener. It is the only RPC
//     surface reachable without a client cert: trust comes from the one-time
//     join token, whose embedded fingerprint pins the cluster CA the client
//     must see before it sends anything.
//   - NodeService runs on every WORKER; the master dials it. Both sides
//     authenticate with cluster-CA-signed certs (mTLS). A node's identity is
//     its UUID, carried in its cert's CN and DNS SAN.
syntax = "proto3";

package skali.cluster.v1;

option go_package = "github.com/Hinkolas/skali/internal/clusterpb;clusterpb";

// EnrollmentService admits new nodes into the cluster.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  // Full join token: <id>.<secret>.<ca-fingerprint>.
  string token = 1;
  // PKCS#10 CSR (PEM). The master takes only the public key; subject and any
  // requested extensions are ignored.
  bytes csr_pem = 2;
  // host:port the master will dial for this node's NodeService.
  string advertise_addr = 3;
  // Initial node name shown in the UI (typically the machine hostname).
  string hostname = 4;
  string arch = 5;            // runtime.GOARCH
  string os = 6;              // runtime.GOOS
  string skalid_version = 7;
}

message EnrollResponse {
  // The node's UUID — also the CN and DNS SAN of the issued cert.
  string node_id = 1;
  // Node cert signed by the cluster CA (PEM).
  bytes cert_pem = 2;
  // Cluster CA cert (PEM); the worker's trust root from here on.
  bytes ca_pem = 3;
  // Roles granted by the join token.
  repeated string roles = 4;
}

// NodeService is the per-worker control surface: heartbeat plus the
// imperative container lifecycle (the Executor seam). Nodes are dumb
// executors — they hold no desired state and run no reconciler; the master
// drives them and reconciles against the observed state heartbeats report.
//
// Log streaming (rpc StreamContainerLogs(...) returns (stream ...)) joins
// here in a later milestone.
service NodeService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CreateContainer(CreateContainerRequest) returns (CreateContainerResponse);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc RemoveContainer(RemoveContainerRequest) returns (RemoveContainerResponse);
  // Image primitives: explicit master-driven pulls (pre-warming decoupled
  // from container create) and removes (the building block later GC drives).
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
  // WatchEvents is a doorbell: the node rings after it has already resampled
  // locally, so a heartbeat poked in response reads fresh cache. Lossy by
  // design — the master's periodic poll remains the level-triggered source
  // of truth; a lost event costs latency, never correctness.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

message HeartbeatRequest {}

message WatchEventsRequest {}

// WatchEventsResponse is one doorbell ring. kind is advisory and may be
// empty — one ring can coalesce several kinds of change, and the master
// resyncs the whole node regardless. The field exists so a future master can
// skip pokes it knows are irrelevant.
message WatchEventsResponse {
  string kind = 1;  // container|image|volume|"" (coalesced)
}

message HeartbeatResponse {
  // Echoed so the master can detect a node answering on another's address.
  string node_id = 1;
  string arch = 2;
  string os = 3;
  string skalid_version = 4;
  uint32 cpu_count = 5;
  reserved 6; // was memory_bytes; superseded by metrics.memory_total_bytes
  // Resource snapshot; absent until the node's sampler has two samples
  // (rates need a delta).
  NodeMetrics metrics = 7;
  // Observed container state. ABSENT means unknown (container sampler cold
  // or engine unreachable) — never "no containers"; the master must leave
  // its records untouched. A present report is authoritative for the node.
  ContainerReport containers = 8;
  // Observed image/volume inventory, same absent-means-unknown doctrine.
  // Sampled slower than containers (inventory changes on pulls and deploys,
  // not continuously).
  InventoryReport inventory = 9;
}

// ContainerReport wraps the container list so "absent" and "empty" stay
// distinguishable on the wire.
message ContainerReport {
  repeated ContainerInfo containers = 1;
}

// InventoryReport wraps the node's image/volume inventory so "absent" and
// "empty" stay distinguishable on the wire. Unlike containers this is
// unfiltered: whole-node disk visibility, managed or not.
message InventoryReport {
  repeated ImageInfo images = 1;
  repeated VolumeInfo volumes = 2;
}

// ImageInfo is one image present on the node.
message ImageInfo {
  string id = 1;  // content-addressable "sha256:…"
  // Empty means dangling ("<none>" placeholders are dropped node-side).
  repeated string repo_tags = 2;
  repeated string repo_digests = 3;
  int64 size_bytes = 4;
  int64 created_at_unix = 5;  // 0 = unknown
  // Containers referencing the image, any owner or state; 0 = unused.
  uint32 containers = 6;
}

// VolumeInfo is one named volume on the node (anonymous volumes included).
// No sizes: only the daemon's system-df walk computes them, too expensive
// for a sampler.
message VolumeInfo {
  string name = 1;
  string driver = 2;
  string scope = 3;  // local|global
  string mountpoint = 4;
  map<string, string> labels = 5;
  int64 created_at_unix = 6;  // 0 = unknown
  // Containers mounting the volume, any owner or state; 0 = unused.
  uint32 containers = 7;
}

// ContainerInfo is one observed skali-managed container.
message ContainerInfo {
  string id = 1;    // engine container id (64-hex)
  string name = 2;  // no leading slash
  string image = 3;
  string state = 4;   // created|running|paused|restarting|removing|exited|dead
  string health = 5;  // ""|starting|healthy|unhealthy ("" = no healthcheck)
  int32 exit_code = 6;
  // Full label map including skali.* — the master maps containers back to
  // resources purely from these.
  map<string, string> labels = 7;
  int64 created_at_unix = 8;
  int64 started_at_unix = 9;  // 0 = never started
  uint32 restart_count = 10;
  // Latest stats; absent until the node's container sampler has two samples.
  ContainerStats stats = 11;
}

// ContainerStats is one derived per-container snapshot. cpu_percent uses
// docker-stats semantics: 100 = one full core (not normalized to the node).
message ContainerStats {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_limit_bytes = 3;  // as reported; host total when unlimited
  uint64 net_rx_bytes_per_sec = 4;
  uint64 net_tx_bytes_per_sec = 5;
}

// ContainerSpec mirrors the engine-level spec (internal/engine). Labels must
// be complete — the master stamps skali.managed/skali.kind before sending;
// the node re-stamps ownership defensively and rejects a missing kind.
message ContainerSpec {
  string name = 1;
  string image = 2;
  map<string, string> env = 3;
  repeated string command = 4;
  repeated string entrypoint = 5;
  repeated ContainerMount mounts = 6;
  repeated ContainerPort ports = 7;
  RestartPolicy restart_policy = 8;
  uint32 restart_max_retries = 9;  // on-failure only
  int64 nano_cpus = 10;            // 1e9 = one core; 0 = unlimited
  int64 memory_limit_bytes = 11;   // 0 = unlimited
  repeated string networks = 12;
  map<string, string> labels = 13;
  Healthcheck healthcheck = 14;
}

message ContainerMount {
  string type = 1;  // bind|volume
  string source = 2;
  string target = 3;
  bool read_only = 4;
}

message ContainerPort {
  string host_ip = 1;  // empty = all interfaces
  uint32 host_port = 2;
  uint32 container_port = 3;
  string protocol = 4;  // tcp|udp; empty = tcp
}

message Healthcheck {
  repeated string test = 1;
  int64 interval_ms = 2;
  int64 timeout_ms = 3;
  uint32 retries = 4;
  int64 start_period_ms = 5;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;  // treated as NO
  RESTART_POLICY_NO = 1;
  RESTART_POLICY_ALWAYS = 2;
  RESTART_POLICY_UNLESS_STOPPED = 3;
  RESTART_POLICY_ON_FAILURE = 4;
}

enum PullPolicy {
  PULL_POLICY_UNSPECIFIED = 0;  // treated as IF_MISSING
  PULL_POLICY_IF_MISSING = 1;
  PULL_POLICY_ALWAYS = 2;
  PULL_POLICY_NEVER = 3;
}

message CreateContainerRequest {
  ContainerSpec spec = 1;
  PullPolicy pull_policy = 2;
  // Start the container after creating it.
  bool start = 3;
}

// Create/Start/Stop responses carry the post-operation state so the master
// can record it immediately instead of waiting for the next heartbeat.
message CreateContainerResponse {
  ContainerInfo container = 1;
}

message StartContainerRequest {
  string container_id = 1;
}

message StartContainerResponse {
  ContainerInfo container = 1;
}

message StopContainerRequest {
  string container_id = 1;
  // Graceful-stop timeout; 0 = engine default.
  uint32 timeout_seconds = 2;
}

message StopContainerResponse {
  ContainerInfo container = 1;
}

message RemoveContainerRequest {
  string container_id = 1;
  bool force = 2;
}

message RemoveContainerResponse {}

message PullImageRequest {
  // Tag or digest reference (e.g. "nginx:alpine").
  string reference = 1;
}

// Carries the post-pull state (in-use count included) so the master records
// it immediately instead of waiting for the next inventory report.
message PullImageResponse {
  ImageInfo image = 1;
}

message RemoveImageRequest {
  // Tag or sha256: id.
  string reference = 1;
  bool force = 2;
}

message RemoveImageResponse {
  // Ids of images actually deleted; empty when the reference was merely
  // untagged from a multi-tagged image (rows stay, heartbeats refresh tags).
  repeated string deleted_ids = 1;
}

// NodeMetrics is the node's latest resource snapshot. Rates are computed on
// the node (bytes/second over the sample interval); cpu_percent is 0-100
// normalized across effective cores (the cgroup quota when the node runs in
// a limited container).
message NodeMetrics {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;       // filesystem backing the node's data dir
  uint64 disk_total_bytes = 5;
  uint64 net_rx_bytes_per_sec = 6;
  uint64 net_tx_bytes_per_sec = 7;
  uint64 disk_read_bytes_per_sec = 8;
  uint64 disk_write_bytes_per_sec = 9;
  double load1 = 10;                // 1-min load average; host-wide, advisory
}
