name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

jobs:
  # Nothing publishes until the same checks that gate main pass on the tag.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser reads tag history for the changelog

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      # qemu: the release Dockerfile has a RUN step, so the arm64 layer
      # executes target-arch instructions on the amd64 runner. Both actions
      # pull their images from our GHCR copies (mirror.yml): anonymous pulls
      # from public registries hit the shared runners' IP limits and failed
      # releases. Bump them in .github/mirrored-images.txt first.
      - uses: docker/setup-qemu-action@v4
        with:
          image: ghcr.io/hinkolas/mirror/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/hinkolas/mirror/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Exact so a release records which GoReleaser built it; bump it
          # together with the ci.yml rehearsal.
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .cache/published-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release.json --dir .cache/published-release --clobber
          go run ./cmd/skali-schema --schema release --version "$RELEASE_TAG" --output .cache/published-release/release.json --verify

  # The site serves the newest release's schemas; rebuild it on main once
  # this release is published (pages.yml explains why not from the tag).
  website:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
