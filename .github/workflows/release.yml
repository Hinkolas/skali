name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tag history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # qemu: the release Dockerfile has a RUN step, so the arm64 layer
      # executes target-arch instructions on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web console image; goreleaser keeps owning the binaries and the
      # skalid image. Runs before goreleaser so a failed image build never
      # leaves a GitHub release without its console.
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: build/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hinkolas/skali-web:${{ github.ref_name }}
            ghcr.io/hinkolas/skali-web:latest

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
