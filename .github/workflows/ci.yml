name: ci

# Shared checks for contributions and releases: every push to main, every
# pull request, and (via workflow_call) every release tag. Advisory scans
# live in audit.yml so a new upstream CVE cannot turn an unrelated push red.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running checks. Tags and
# release calls never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # DB-backed tests create an ephemeral database per test on this
      # server (internal/testdb); without TEST_DATABASE_URL they skip.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dev:dev@localhost:5432/dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          # Pinned to the version sqlc generate was last run with locally;
          # a mismatch shows up as generated drift, so bump both together.
          sqlc-version: "1.30.0"

      # Drift checks: the tree must already contain what the tools would
      # produce. Each prints the offending diff before failing.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^web/'))
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Generated schemas and sqlc store are current
        run: |
          go generate ./internal/manifest ./internal/layout ./internal/installer
          sqlc generate
          git diff --exit-code

      # web/ is excluded like task test: node_modules occasionally ships
      # stray Go packages.
      - run: go vet $(go list ./... | grep -v '/web/')
      - run: go test $(go list ./... | grep -v '/web/')
      - name: Linux restore ownership
        run: |
          go test -c -o /tmp/skali-backup-tests ./internal/backup
          sudo /tmp/skali-backup-tests -test.run 'TestArchive|TestLinuxNonRoot|TestTarUntar'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Rehearse clean snapshot metadata
        run: scripts/check-release-snapshot.sh
