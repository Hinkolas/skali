name: audit

# Dependency advisory scans. Kept out of ci.yml on purpose: they depend on
# the advisory feed, not on the pushed change, so they run daily and on
# demand instead of gating every push. Run it by hand before a release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./cmd/... ./internal/...
      - name: Audit example modules
        shell: bash
        run: |
          while IFS= read -r manifest; do
            echo "Auditing $manifest"
            (cd "$(dirname "$manifest")" && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          done < <(git ls-files 'examples/**/go.mod')

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm audit

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit
