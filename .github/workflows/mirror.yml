name: mirror

# Copies the images in .github/mirrored-images.txt to ghcr.io/hinkolas/mirror
# with their digests unchanged. CI and the release pull only those copies:
# anonymous pulls from Docker Hub and ECR Public share their limit with every
# other job on the runner's IP and failed whole runs before a test started.
# Only this workflow pulls from a public registry, so a refusal here is
# rerun later instead of failing a pull request or a release.
#
# It runs whenever the list changes, on any branch, so a branch that bumps an
# image gets its copy before its CI needs it. Images already copied are
# skipped, so a run only pulls what is new.
on:
  push:
    paths:
      - .github/mirrored-images.txt
      - .github/workflows/mirror.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Copy images
        shell: bash
        run: |
          set -euo pipefail
          # The digest of what a reference resolves to, empty if it does not.
          digest_of() {
            # Hash the bytes straight from the pipe: $(...) would strip a
            # trailing newline and change the digest.
            local sum
            sum=$(skopeo inspect --raw "docker://$1" </dev/null 2>/dev/null | sha256sum) || return 0
            printf 'sha256:%s' "${sum%% *}"
          }
          mapfile -t sources < <(grep -vE '^[[:space:]]*(#|$)' .github/mirrored-images.txt)
          for source in "${sources[@]}"; do
            digest=${source##*@}
            ref=${source%@*}
            case "$ref" in
              */*:*) ;;
              *) echo "::error::$source: want registry/name:tag@sha256:..."; exit 1 ;;
            esac
            target=ghcr.io/hinkolas/mirror/${ref##*/}
            # skopeo refuses a tag and a digest together: pull by digest.
            pull=${ref%:*}@$digest
            if [ "$(digest_of "$target")" = "$digest" ]; then
              echo "$target is current"
              continue
            fi
            echo "Copying $pull to $target"
            # --all keeps every platform and attestation in the index;
            # --preserve-digests fails instead of rewriting any manifest.
            skopeo copy --all --preserve-digests --retry-times 5 \
              "docker://$pull" "docker://$target" </dev/null
            got=$(digest_of "$target")
            if [ "$got" != "$digest" ]; then
              echo "::error::$target resolves to ${got:-nothing}, want $digest"
              exit 1
            fi
          done
