# Project tasks. Dev dependencies come from the machine-global setup
# (~/Taskfile.yml): one shared dev-postgres container, one database per
# project — `task db` provisions skali's. Later, skalid manages its own
# control-plane Postgres through its container engine and this goes away
# entirely (see .plan/DECISIONS.md).

version: "3"

silent: true

# The binaries load .env themselves (godotenv); this makes it reach bare
# `go test` too (TEST_DATABASE_URL).
dotenv: [".env"]

vars:
  DB_NAME: skali
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev
  LDFLAGS: -X github.com/Hinkolas/skali/internal/version.Version={{.VERSION}}

tasks:
  build:
    desc: Build both binaries into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skalid ./cmd/skalid
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skali ./cmd/skali

  generate:
    desc: Regenerate the sqlc store (migrations/ + query/) and gRPC bindings (proto/)
    cmds:
      - sqlc generate
      # buf + protoc-gen-go + protoc-gen-go-grpc come from the machine-global
      # dev setup (go install ...@latest), same as sqlc.
      - buf lint
      - buf generate

  test:
    desc: Run the Go test suite (DB tests need TEST_DATABASE_URL, see .env.example)
    cmds:
      # web/ is excluded: node_modules occasionally ships stray Go packages.
      - go test $(go list ./... | grep -v '/web/')

  db:
    desc: Ensure the shared dev Postgres is up and skali's database exists
    cmds:
      - task -g db:start DB_NAME={{.DB_NAME}}

  dev:
    desc: Run the daemon against the shared dev Postgres (takes over :7070)
    deps: [db]
    cmds:
      # Free the port first so a restart always wins, whatever started the
      # previous instance (an old terminal, a background task, …). 7070
      # mirrors the HTTP_ADDR default.
      - lsof -ti :7070 | xargs kill 2>/dev/null || true
      - go run ./cmd/skalid serve

  dev:web:
    desc: Run the SvelteKit BFF dev server
    dir: web
    cmds:
      - npm run dev

  cluster:up:
    desc: Build and start the 3-node DinD dev cluster (master + 2 workers)
    dir: deploy/dev-cluster
    env:
      CLUSTER_VERSION: "{{.VERSION}}"
    cmds:
      # Frees :7070/:7443 first — a bare-process skalid from an earlier
      # session would collide with the master's published ports.
      - lsof -ti :7070 -ti :7443 | xargs kill 2>/dev/null || true
      - docker compose up -d --build --wait
      - 'echo "cluster up — API http://localhost:7070, login dev@skali.local / skali-dev-password (task dev:web for the UI)"'

  cluster:down:
    desc: Tear the dev cluster down (removes DB and node identities)
    dir: deploy/dev-cluster
    cmds:
      - docker compose down -v --remove-orphans

  cluster:logs:
    desc: Follow dev-cluster logs
    dir: deploy/dev-cluster
    cmds:
      - docker compose logs -f --tail 100

  cluster:ps:
    desc: Show dev-cluster status
    dir: deploy/dev-cluster
    cmds:
      - docker compose ps
