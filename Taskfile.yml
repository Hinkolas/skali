# Project tasks. Dev dependencies come from the machine-global setup
# (~/Taskfile.yml): one shared dev-postgres container, one database per
# project — `task db` provisions skali's. The dev Kubernetes substrate is a
# k3d cluster (see .plan/02-architecture.md).

version: "3"

silent: true

# The binaries load .env themselves (godotenv); this makes it reach bare
# `go test` too (TEST_DATABASE_URL).
dotenv: [".env"]

vars:
  DB_NAME: skali
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev
  LDFLAGS: -X github.com/Hinkolas/skali/internal/version.Version={{.VERSION}}

tasks:
  build:
    desc: Build both binaries into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skalid ./cmd/skalid
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skali ./cmd/skali

  generate:
    desc: Regenerate the sqlc store (migrations/ + query/)
    cmds:
      - sqlc generate

  test:
    desc: Run the Go test suite (DB tests need TEST_DATABASE_URL, see .env.example)
    cmds:
      # web/ is excluded: node_modules occasionally ships stray Go packages.
      - go test $(go list ./... | grep -v '/web/')

  db:
    desc: Ensure the shared dev Postgres is up and skali's database exists
    cmds:
      - task -g db:start DB_NAME={{.DB_NAME}}

  dev:
    desc: Run the daemon against the shared dev Postgres (takes over :7070)
    deps: [db]
    cmds:
      # Free the port first so a restart always wins, whatever started the
      # previous instance (an old terminal, a background task, …). 7070
      # mirrors the HTTP_ADDR default.
      - lsof -ti :7070 | xargs kill 2>/dev/null || true
      - go run ./cmd/skalid serve

  dev:web:
    desc: Run the SvelteKit BFF dev server
    dir: web
    cmds:
      - npm run dev
