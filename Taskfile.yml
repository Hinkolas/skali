# Project-owned development dependencies; see compose.yaml.

version: "3"

silent: true

# The binaries load .env themselves (godotenv); this makes it reach bare
# `go test` too (TEST_DATABASE_URL).
dotenv: [".env"]

vars:
  VERSION:
    sh: git describe --tags --dirty 2>/dev/null || echo v0.0.0-dev
  LDFLAGS: -X github.com/Hinkolas/skali/internal/version.Version={{.VERSION}}

tasks:
  # --- Build and install ---

  build:
    desc: Build all binaries into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skalid ./cmd/skalid
      - go build -ldflags "{{.LDFLAGS}}" -o bin/skali ./cmd/skali
      # hostd always runs inside the Linux managed host (directly or in
      # Lima), even when the CLI itself is built on macOS.
      - GOOS=linux go build -ldflags "{{.LDFLAGS}}" -o bin/skali-hostd ./cmd/skali-hostd

  build:image:
    desc: Build the skalid:dev image from this checkout and save it to .cache/skalid-dev.tar (needs docker)
    cmds:
      - docker build -t skalid:dev -f build/skalid.Dockerfile .
      - mkdir -p .cache
      - docker save skalid:dev -o .cache/skalid-dev.tar

  build:web-image:
    desc: Build the skali-web:dev console image from this checkout and save it to .cache/skali-web-dev.tar (needs docker)
    cmds:
      - docker build -t skali-web:dev -f build/web.Dockerfile web
      - mkdir -p .cache
      - docker save skali-web:dev -o .cache/skali-web-dev.tar

  install:cli:
    desc: Build the skali CLI and install it to ~/.local/bin
    cmds:
      # Same destination the installer will use: on PATH, no sudo.
      - mkdir -p "$HOME/.local/bin"
      - mkdir -p "$HOME/.local/share/skali"
      - go build -ldflags "{{.LDFLAGS}}" -o "$HOME/.local/bin/skali" ./cmd/skali
      - GOOS=linux go build -ldflags "{{.LDFLAGS}}" -o "$HOME/.local/share/skali/skali-hostd_linux_{{ARCH}}" ./cmd/skali-hostd
      - echo "installed $("$HOME/.local/bin/skali" --version) to ~/.local/bin/skali"

  install:server:
    desc: "Build everything from this checkout and run the interactive cluster installer (source install: no remote binaries or images; needs go and docker)"
    interactive: true
    cmds:
      - task: build
      - task: build:image
      - task: build:web-image
      # Linux installs this host (hence sudo); macOS manages a Lima VM
      # rootless. The tars are imported into the node during init instead of
      # pulling from a registry.
      - '{{if eq OS "linux"}}sudo {{end}}./bin/skali cluster --image-tar .cache/skalid-dev.tar --web-image-tar .cache/skali-web-dev.tar'

  # --- Dev loop ---

  dev:
    desc: Run the daemon against the project dev Postgres (takes over :7070)
    deps: [db]
    cmds:
      # Free the port first so a restart always wins, whatever started the
      # previous instance (an old terminal, a background task, ...). 7070
      # mirrors the HTTP_ADDR default.
      - lsof -ti :7070 | xargs kill 2>/dev/null || true
      - go run ./cmd/skalid serve

  dev:web:
    desc: Run the SvelteKit BFF dev server
    dir: web
    cmds:
      - npm run dev

  dev:image:
    desc: Build the skalid image from the working tree; the next skali dev imports and rolls it
    cmds:
      - docker build -t skalid:dev -f build/skalid.Dockerfile .

  seed:
    desc: Fabricate development data for the console (users, projects, history, telemetry)
    deps: [db]
    cmds:
      - go run ./cmd/skalid migrate up
      - go run ./cmd/skalid seed {{.CLI_ARGS}}

  seed:reset:
    desc: Remove previously seeded data and seed again
    deps: [db]
    cmds:
      - go run ./cmd/skalid migrate up
      - go run ./cmd/skalid seed --reset {{.CLI_ARGS}}

  db:
    desc: Start the project Postgres on localhost:55432 (Docker Compose)
    cmds:
      - docker compose up -d --wait postgres

  db:stop:
    desc: Stop the project Postgres, preserving its data
    cmds:
      - docker compose stop postgres

  # --- Code generation ---

  generate:
    desc: Regenerate the JSON schemas and sqlc store
    cmds:
      - go generate ./internal/manifest ./internal/layout ./internal/installer
      - sqlc generate

  # --- Tests ---

  test:
    desc: Run the Go test suite (DB tests need TEST_DATABASE_URL, see .env.example)
    cmds:
      # web/ is excluded: node_modules occasionally ships stray Go packages.
      - go test $(go list ./... | grep -v '/web/')

  test:db:
    desc: Run Go tests including DB-backed tests on the project Postgres
    deps: [db]
    env:
      TEST_DATABASE_URL: 'postgres://dev:dev@127.0.0.1:{{.SKALI_DEV_DB_PORT | default "55432"}}/skali?sslmode=disable'
    cmds:
      - go test $(go list ./... | grep -v '/web/')

  test:live:
    desc: Run the live cluster tests against the k3d test cluster
    cmds:
      - TEST_KUBECONFIG=$(pwd)/.k3d/kubeconfig go test -timeout 20m -run 'TestLive' ./internal/kube/... ./internal/observe/... ./internal/reconcile/...

  test:docker:
    desc: Run the tests that exec docker (buildx, throwaway registry)
    cmds:
      - TEST_DOCKER=1 go test -timeout 15m -run 'TestDocker|TestImport' ./internal/build/...

  test:dev:
    desc: Run the skali dev end-to-end suite (creates and mutates the skali-dev cluster)
    cmds:
      - TEST_SKALI_DEV=1 go test -timeout 40m -count=1 -run 'TestDev' ./cmd/skali/...

  test:cluster:
    desc: Run the skali cluster end-to-end suite in the Lima VM (task lima:up first)
    cmds:
      - TEST_SKALI_CLUSTER=1 go test -timeout 50m -count=1 -run 'TestClusterEndToEnd' ./cmd/skali/...

  test:cluster:darwin:
    desc: Run the darwin skali cluster end-to-end suite natively (creates and deletes its own small VM; stop the Linux e2e VMs first)
    cmds:
      - TEST_SKALI_CLUSTER_DARWIN=1 go test -timeout 40m -count=1 -run 'TestClusterDarwin' ./cmd/skali/...

  # --- Test infrastructure ---

  k3d:up:
    desc: Create the pinned k3d test cluster and write .k3d/kubeconfig
    cmds:
      - k3d cluster create skali-test --image rancher/k3s:v1.36.3-k3s1 --no-lb --kubeconfig-update-default=false --wait || true
      # Single-container layout: rename the node to the bare cluster name and
      # drop the idle k3d-tools helper. The rename skips legacy clusters (a
      # present serverlb resolves the node by its old name); recreate those
      # with task k3d:down first.
      - if docker container inspect k3d-skali-test-server-0 >/dev/null 2>&1 && ! docker container inspect k3d-skali-test-serverlb >/dev/null 2>&1; then docker rename k3d-skali-test-server-0 skali-test; fi
      - docker rm -f k3d-skali-test-tools >/dev/null 2>&1 || true
      - mkdir -p .k3d
      - k3d kubeconfig get skali-test > .k3d/kubeconfig

  k3d:down:
    desc: Delete the k3d test cluster
    cmds:
      - k3d cluster delete skali-test

  lima:up:
    desc: Create and start the installer e2e VMs (server + agent, Ubuntu, real systemd)
    cmds:
      # Existence check first: a bare `limactl start <name>` would silently
      # create a default VM instead of using the template.
      - |
        if limactl list --format '{{"{{"}}.Name{{"}}"}}' 2>/dev/null | grep -qx skali-e2e; then
          limactl start skali-e2e
        else
          limactl start --name skali-e2e --tty=false build/lima/skali-e2e.yaml
        fi
      - |
        if limactl list --format '{{"{{"}}.Name{{"}}"}}' 2>/dev/null | grep -qx skali-e2e-agent; then
          limactl start skali-e2e-agent
        else
          limactl start --name skali-e2e-agent --tty=false build/lima/skali-e2e-agent.yaml
        fi

  lima:down:
    desc: Delete the installer e2e VMs
    cmds:
      - limactl delete -f skali-e2e || true
      - limactl delete -f skali-e2e-agent || true

  # --- Release ---

  release:check:
    desc: Validate .goreleaser.yaml
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build a local snapshot release into dist/ (no publish); pass flags after --, for example task release:snapshot -- --skip=docker
    cmds:
      - goreleaser release --snapshot --clean {{.CLI_ARGS}}

  # Pushing a v* tag is the release button: CI runs on the tag, goreleaser
  # publishes binaries and images, and the GitHub release it creates is what
  # every running cluster's update scan offers as an upgrade. The
  # preconditions refuse to press it from the wrong commit or with a version
  # the scanner, goreleaser, and release.yml would not agree on.
  release:tag:
    desc: "Tag and push a release from origin/main: task release:tag V=v0.1.0"
    interactive: true
    deps: [release:check]
    preconditions:
      - sh: test -n "{{.V}}"
        msg: "pass the version: task release:tag V=v0.1.0"
      # Mirrors internal/version.releasePattern: anything else publishes
      # fine but the update scanner never recognizes it.
      - sh: printf '%s' "{{.V}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'
        msg: "version must look like v1.2.3 or v1.2.3-rc.1 (dotted alpha, beta, rc suffixes only, never -rc1; see internal/version)"
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "commit or stash your changes first"
      - sh: test "$(git rev-parse --abbrev-ref HEAD)" = main
        msg: "releases are tagged on main"
      - sh: git fetch --quiet origin main --tags && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: "HEAD is not origin/main; push (or pull) first so the release points at a commit on main"
      # Quote the leading ! so YAML does not consume it as a tag marker.
      - sh: '! git rev-parse -q --verify "refs/tags/{{.V}}" >/dev/null'
        msg: "tag {{.V}} already exists locally"
      - sh: test -z "$(git ls-remote --tags origin "refs/tags/{{.V}}")"
        msg: "tag {{.V}} already exists on origin"
    cmds:
      - |
        echo "release {{.V}}"
        echo "  commit  $(git log -1 --format='%h %s')"
        echo "  branch  main (in sync with origin/main)"
        case "{{.V}}" in *-*) echo "  kind    prerelease (GitHub prerelease, latest does not move, beta channel only)";; *) echo "  kind    release (moves latest, offered to every cluster)";; esac
        case "{{.V}}" in v0.*) echo "  stage   initial development (0.x: breaking changes allowed between minors)";; *) echo "  stage   stable (breaking changes need a major bump)";; esac
        printf 'tag and push? [y/N] '
        read -r answer
        case "$answer" in y|Y|yes) ;; *) echo "aborted"; exit 1;; esac
      - git tag -a "{{.V}}" -m "{{.V}}"
      - git push origin "refs/tags/{{.V}}"
      - echo "pushed {{.V}}; the release workflow takes it from here"
