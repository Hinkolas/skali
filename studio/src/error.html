<!doctype html>

<!-- Static fallback for hard failures (SSR crash, error page itself failing).
     No bundled CSS/fonts here, so the theme tokens are inlined. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% — skali</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0b0b0f;
				color: #ececf1;
				font-family: ui-sans-serif, system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			main {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				padding: 48px 16px;
			}
			.halo {
				position: absolute;
				top: 21px;
				left: 50%;
				width: 1200px;
				height: 800px;
				transform: translate(-50%, -50%);
				pointer-events: none;
				background: radial-gradient(
					closest-side,
					rgb(124 92 255 / 0.13) 0%,
					rgb(124 92 255 / 0.08) 20%,
					rgb(124 92 255 / 0.042) 40%,
					rgb(124 92 255 / 0.017) 60%,
					rgb(124 92 255 / 0.004) 80%,
					rgb(124 92 255 / 0) 100%
				);
			}
			.logo {
				display: grid;
				place-items: center;
				width: 42px;
				height: 42px;
				border-radius: 12px;
				background: linear-gradient(135deg, #9076ff, #5b33ff);
				box-shadow: 0 0 26px rgb(124 92 255 / 0.4);
				color: #0b0b0f;
				font-size: 22px;
				font-weight: 700;
				margin-bottom: 26px;
			}
			.code {
				font-family: ui-monospace, 'SF Mono', monospace;
				font-size: 40px;
				line-height: 1;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			h1 {
				margin: 12px 0 0;
				font-size: 16px;
				font-weight: 600;
			}
			p {
				margin: 6px 0 0;
				max-width: 360px;
				font-size: 13px;
				color: #9899a6;
			}
			a {
				display: inline-block;
				margin-top: 24px;
				padding: 9px 18px;
				border-radius: 10px;
				background: linear-gradient(135deg, #9076ff, #5b33ff);
				box-shadow: 0 0 18px rgb(124 92 255 / 0.28);
				color: #0b0b0f;
				font-size: 13.5px;
				font-weight: 600;
				text-decoration: none;
			}
			a:hover {
				filter: brightness(1.08);
			}
		</style>
	</head>

	<body>
		<main>
			<div class="halo"></div>
			<div class="logo">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2.25"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
					<rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
					<line x1="6" x2="6.01" y1="6" y2="6" />
					<line x1="6" x2="6.01" y1="18" y2="18" />
				</svg>
			</div>
			<div class="code">%sveltekit.status%</div>
			<h1>%sveltekit.error.message%</h1>
			<p>The page failed to render. Reload, or head back home.</p>
			<a href="/">Go to home</a>
		</main>
	</body>
</html>
