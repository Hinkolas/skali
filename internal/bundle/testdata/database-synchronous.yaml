apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: skali-db
  namespace: skali-system
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 3
  priorityClassName: skali-critical
  storage:
    size: 10Gi
  affinity:
    nodeSelector:
      skali.dev/capability-database: "true"
  postgresql:
    synchronous:
      method: any
      number: 1
  bootstrap:
    initdb:
      database: skali
      owner: skali
