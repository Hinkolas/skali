apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    service:
      spec:
        type: ClusterIP
    metrics:
      prometheus:
        addRoutersLabels: true
    ports:
      metrics:
        expose:
          default: true
      web:
        hostPort: 80
      websecure:
        hostPort: 443
        transport:
          respondingTimeouts:
            readTimeout: 30m
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
