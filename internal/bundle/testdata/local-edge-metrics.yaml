apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        addRoutersLabels: true
    ports:
      metrics:
        expose:
          default: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 30m
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
