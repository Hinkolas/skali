apiVersion: v1
kind: ServiceAccount
metadata:
  name: skalid
  namespace: skali-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skalid
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, configmaps, services, services/proxy, pods, pods/log, pods/exec, events, persistentvolumeclaims, nodes]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: ["*"]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: ["*"]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: ["*"]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: ["*"]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: ["*"]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skalid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skalid
subjects:
  - kind: ServiceAccount
    name: skalid
    namespace: skali-system
---
apiVersion: v1
kind: Secret
metadata:
  name: skali-auth
  namespace: skali-system
type: Opaque
data:
  AUTH_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skalid
  namespace: skali-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skalid
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skalid
      annotations:
        skali.dev/image-id: sha256:0123456789abcdef
    spec:
      serviceAccountName: skalid
      priorityClassName: skali-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: skalid
      initContainers:
        - name: migrate
          image: skalid:dev
          imagePullPolicy: IfNotPresent
          args: [migrate, up]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skali-db-app
                  key: uri
      containers:
        - name: skalid
          image: skalid:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7070
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skali-db-app
                  key: uri
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: skali-auth
                  key: AUTH_SECRET
            - name: SKALI_REGISTRY_HOST
              value: localhost:5510
            - name: SKALI_REGISTRY_ENDPOINT
              value: skali-registry.skali-system.svc:5000
            - name: SKALI_REGISTRY_INSECURE
              value: "true"
            - name: SKALI_CAPABILITIES
              value: application;edge;database;object-storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7070
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skalid
  namespace: skali-system
spec:
  selector:
    app.kubernetes.io/name: skalid
  ports:
    - port: 80
      targetPort: 7070
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skalid
  namespace: skali-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`skali.localhost`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: skalid
          port: 80
