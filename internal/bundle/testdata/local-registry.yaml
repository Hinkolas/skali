apiVersion: v1
kind: ConfigMap
metadata:
  name: skali-registry-config
  namespace: skali-system
data:
  config.yml: |
    version: 0.1
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skali-registry-data
  namespace: skali-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skali-registry
  namespace: skali-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skali-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skali-registry
    spec:
      priorityClassName: skali-critical
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/docker/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skali-registry-data
        - name: config
          configMap:
            name: skali-registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: skali-registry
  namespace: skali-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: skali-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
