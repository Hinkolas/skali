apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: skali-db
  namespace: skali-system
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 1
  priorityClassName: skali-critical
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: skali
      owner: skali
