apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hello-world-web
    skali.dev/application: web
    skali.dev/managed: "true"
    skali.dev/project: hello-world
    skali.dev/service: web
  name: hello-world-web
  namespace: skali-hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-web
      skali.dev/application: web
      skali.dev/managed: "true"
      skali.dev/project: hello-world
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world-web
        skali.dev/application: web
        skali.dev/managed: "true"
        skali.dev/project: hello-world
        skali.dev/service: web
    spec:
      containers:
      - image: localhost:5510/skali/hello-world/web@sha256:1111111111111111111111111111111111111111111111111111111111111111
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 2
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources: {}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: hello-world-web
            skali.dev/application: web
            skali.dev/managed: "true"
            skali.dev/project: hello-world
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hello-world-web
    skali.dev/application: web
    skali.dev/managed: "true"
    skali.dev/project: hello-world
    skali.dev/service: web
  name: hello-world-web
  namespace: skali-hello-world
spec:
  ports:
  - appProtocol: http
    name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: hello-world-web
    skali.dev/application: web
    skali.dev/managed: "true"
    skali.dev/project: hello-world
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: skali
  labels:
    app.kubernetes.io/name: hello-world-web
    skali.dev/application: web
    skali.dev/managed: "true"
    skali.dev/project: hello-world
    skali.dev/service: web
  name: hello-world-web-public
  namespace: skali-hello-world
spec:
  ingressClassName: traefik
  rules:
  - host: hello.localhost
    http:
      paths:
      - backend:
          service:
            name: hello-world-web
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - hello.localhost
    secretName: hello-world-web-public-tls
