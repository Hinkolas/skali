apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: hello-world-api
    skali.dev/application: api
    skali.dev/managed: "true"
    skali.dev/project: hello-world
  name: hello-world-api
  namespace: skali-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-api
      skali.dev/application: api
      skali.dev/managed: "true"
      skali.dev/project: hello-world
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world-api
        skali.dev/application: api
        skali.dev/managed: "true"
        skali.dev/project: hello-world
    spec:
      containers:
      - image: ghcr.io/hinkolas/hello-world/api:1.0.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 30
          timeoutSeconds: 2
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        resources: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: hello-world-api
    skali.dev/application: api
    skali.dev/managed: "true"
    skali.dev/project: hello-world
  name: hello-world-api
  namespace: skali-hello-world
spec:
  ports:
  - appProtocol: http
    name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: hello-world-api
    skali.dev/application: api
    skali.dev/managed: "true"
    skali.dev/project: hello-world
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: skali
  labels:
    app.kubernetes.io/name: hello-world-api
    skali.dev/application: api
    skali.dev/managed: "true"
    skali.dev/project: hello-world
  name: hello-world-api-public
  namespace: skali-hello-world
spec:
  ingressClassName: traefik
  rules:
  - host: hello.localhost
    http:
      paths:
      - backend:
          service:
            name: hello-world-api
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - hello.localhost
    secretName: hello-world-api-public-tls
