# Generates the gRPC bindings into internal/clusterpb (checked in, like the
# sqlc output). Plugins come from the machine-global dev setup:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/Hinkolas/skali
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/Hinkolas/skali
