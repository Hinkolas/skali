# yaml-language-server: $schema=../../schemas/skali.schema.json


name: file-sharing
description: Presigned-URL reference application with a project-isolated PostgreSQL database and an S3 bucket

# The presigned-URL reference (see README.md): the application authorizes
# a request and signs an S3 URL, the browser moves the bytes straight to
# the bucket endpoint. It also exercises most of the manifest surface
# (resources, autoscaling, placement, rollout, a release command).

# ${NAME} values come from the project environment and are derived from use:
# a missing value without a default fails validation before deployment, and
# ${NAME:-default} uses a fallback. Every value is stored encrypted and stays
# write-only; deployments and logs only ever show the name.
applications:
  web:
    # The context is relative to the project root; the Dockerfile is relative
    # to that context. Local and cloud builders consume the same definition.
    build:
      context: ./web
      dockerfile: deploy/Dockerfile
      target: runtime

    # The command replaces the image's CMD (it renders as the container's
    # args on top of the image entrypoint, which this image leaves unset).
    command: ["/app/file-sharing", "serve"]

    environment:
      UPLOAD_TOKEN: "${UPLOAD_TOKEN}"
      PRESIGN_TTL: "${PRESIGN_TTL:-15m}"
      # Overrides the signing host (local development: the loopback port
      # the local platform maps the store to); empty signs for S3_ENDPOINT.
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-}"

      # Double-brace expressions reference values produced by managed Skali
      # services. The left side remains the variable name expected by the app.
      POSTGRES_HOST: "{{databases.data.host}}"
      POSTGRES_PORT: "{{databases.data.port}}"
      POSTGRES_DATABASE: "{{databases.data.name}}"
      POSTGRES_USER: "{{databases.data.username}}"
      POSTGRES_PASSWORD: "{{databases.data.password}}"

      # endpoint is what browsers reach and URLs are signed for; the
      # application's own traffic stays on the in-cluster address.
      S3_ENDPOINT: "{{buckets.files.endpoint}}"
      S3_INTERNAL_ENDPOINT: "{{buckets.files.internal_endpoint}}"
      S3_BUCKET: "{{buckets.files.name}}"
      S3_REGION: "{{buckets.files.region}}"
      S3_ACCESS_KEY: "{{buckets.files.access_key}}"
      S3_SECRET_KEY: "{{buckets.files.secret_key}}"

    ports:
      http:
        port: 8080
        protocol: http

    routes:
      public:
        domain: "${APP_DOMAIN}"
        # Path defaults to `/` when omitted. Another application can use the
        # same domain with a more specific path such as `/api`.
        path: /
        port: http
        tls: automatic

    health:
      startup:
        http:
          port: http
          path: /health/startup
        interval: 2s
        timeout: 2s
        failureThreshold: 30
      readiness:
        http:
          port: http
          path: /health/ready
        interval: 10s
        timeout: 2s
        failureThreshold: 3
      liveness:
        http:
          port: http
          path: /health/live
        interval: 30s
        timeout: 2s
        failureThreshold: 3

    # Requests reserve schedulable capacity; limits bound a single replica.
    # Skali accepts decimal units such as MB/GB and binary units such as
    # MiB/GiB, then converts them for the selected orchestration backend.
    resources:
      requests:
        cpu: 0.2
        memory: 256MB
        temporaryStorage: 256MB
      limits:
        cpu: 1
        memory: 1GB
        temporaryStorage: 2GB

    scaling:
      replicas:
        min: 2
        max: 5
      autoscaling:
        cpu:
          targetUtilization: 70

    # Prefer spreading replicas across two nodes while still allowing the same
    # manifest to run on a single-node local development cluster.
    placement:
      spread:
        across: nodes
        minimum: 2
        enforcement: preferred

    deployment:
      # Release commands run once with the new image and its service references
      # resolved before the application replicas roll forward.
      releaseCommand:
        command: ["/app/file-sharing", "migrate", "up"]
        timeout: 5m
      # Opts out of the blue-green default: this service is compatible with
      # its previous release and the cluster should not hold two full copies
      # of it during a deploy. Leave the block out to get blue-green.
      rollout:
        strategy: rolling
        maxUnavailable: 0
        maxSurge: 1
        timeout: 10m

    shutdown:
      gracePeriod: 30s

databases:
  data:
    engine: postgres
    version: 17

    # Project isolation gives this environment its own physical database while
    # leaving placement and relocation under Skali's control. Local
    # development collapses every isolation class onto its one pool.
    isolation: project
    availability: single

    storage:
      size: 20GB

    extensions:
      - pg_trgm

# The v1 bucket surface is private visibility with a hard storage quota;
# public-read, versioning, object-count/size quotas, and lifecycle rules
# arrive with later policies and are rejected at deploy until then. A
# private bucket is exactly what presigned URLs want: the URL carries the
# authorization, nothing is ever readable anonymously.
buckets:
  files:
    visibility: private

    # The hostname browsers reach: presigned URLs are signed for it, the
    # edge serves exactly this bucket on it with automatic TLS, and the
    # application's own traffic stays on the in-cluster address.
    route:
      domain: "${STORAGE_DOMAIN}"

    quotas:
      storage: 20GB

    # Parts of uploads the browser never finished are freed after this.
    lifecycle:
      abortIncompleteUploadsAfter: 6h
