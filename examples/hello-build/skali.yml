# yaml-language-server: $schema=../../schemas/skali.schema.json

version: "1"

name: hello-build
description: Minimal build-sourced HTTP application (the R3 local-build flagship)

applications:
  web:
    # Build sources are built locally through BuildKit, pushed into the
    # managed registry, and pinned by digest exactly like imported images.
    build:
      context: .

    ports:
      http:
        port: 8080
        protocol: http

    routes:
      public:
        domain: "${APP_DOMAIN}"
        path: /
        port: http
        tls: automatic

    health:
      readiness:
        http:
          port: http
          path: /healthz
        interval: 5s
        timeout: 2s
      liveness:
        http:
          port: http
          path: /healthz
        interval: 30s
        timeout: 2s

    scaling:
      replicas:
        min: 3
