# yaml-language-server: $schema=../../schemas/skali.schema.json

version: "1"

name: guestbook
description: Build-sourced application connected to a managed PostgreSQL database and an S3 bucket

applications:
  web:
    build:
      context: .

    ports:
      http:
        port: 8080
        protocol: http

    # A persistent volume beside the database and bucket, so the example
    # (and the backup e2e suite) exercises every stateful kind.
    volumes:
      disk:
        mountPath: /data
        size: 1GB

    routes:
      public:
        domain: "${APP_DOMAIN}"
        path: /
        port: http
        tls: automatic

    environment:
      # Typed output references: the application waits for the database and
      # the bucket and starts with the substrate's injected connection
      # outputs.
      DATABASE_URL: "{{ databases.data.url }}"
      S3_ENDPOINT: "{{ buckets.files.endpoint }}"
      S3_BUCKET: "{{ buckets.files.name }}"
      S3_REGION: "{{ buckets.files.region }}"
      S3_ACCESS_KEY: "{{ buckets.files.access_key }}"
      S3_SECRET_KEY: "{{ buckets.files.secret_key }}"

    health:
      readiness:
        http:
          port: http
          path: /healthz
        interval: 5s
        timeout: 2s
      liveness:
        http:
          port: http
          path: /healthz
        interval: 30s
        timeout: 2s

databases:
  data:
    engine: postgres
    version: 17

buckets:
  files:
    quotas:
      storage: 1GB
