openapi: 3.1.0
info:
  title: skali API
  description: |
    Client-facing API of skali. Authentication is email+password with
    optional TOTP two-factor; sessions are opaque bearer tokens. The same
    API serves every client: the web BFF, the `skali` CLI, and future
    native apps.

    There is no registration endpoint: users are created by an instance
    admin (`/v1/users`) or by the server operator (`skalid user create`).
    Every user carries an instance-wide role — `admin` (additionally
    manages users and instance settings) or `member` — checked per
    request. All error responses share the `Error` envelope; clients
    should branch on `error.code`, not on messages.

    Security-critical operations sit behind sudo mode: they require the
    session to have proven the user's identity recently (within the
    operator-configured reauth window). A stale session receives
    `403 reauth_required`; clients recover by confirming identity at
    `/v1/auth/reauth` and retrying the original request.
  version: 0.1.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Same host the spec is served from.

security:
  - bearerAuth: []

paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a `session` when the user has no second factor, or a
        `challenge` when 2FA is enabled — exchange it with a code at
        `/v1/auth/2fa/verify` within its expiry. Exactly one of the two
        properties is present.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
      responses:
        "200":
          description: Password accepted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionCreatedResponse"
                  - $ref: "#/components/schemas/ChallengeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Complete a 2FA login
      description: |
        Exchanges a login challenge plus a 6-digit TOTP code — or a backup
        code — for a session. Challenges are single-use, expire after a few
        minutes, and are deleted after 5 failed codes.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or a backup code.
      responses:
        "200":
          description: Second factor accepted; session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreatedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the authenticated user and session
      tags: [auth]
      responses:
        "200":
          description: The caller's user and session.
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags: [auth]
      responses:
        "200":
          description: All unexpired sessions of the caller, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/reauth:
    post:
      operationId: reauthenticate
      summary: Confirm identity for sudo mode
      description: |
        Re-proves the caller's identity and refreshes the current session's
        sudo-mode window; other sessions of the same user are unaffected.
        Factor policy: accounts with confirmed two-factor present a TOTP or
        backup code (`code`; the code is consumed), all others present their
        `password`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        "204":
          description: Identity confirmed; the session is fresh again.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: |
        Revokes every other session; only the requesting one survives.
        Sudo-mode gated; additionally requires the current password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }

  /v1/auth/2fa/enable:
    post:
      operationId: enableTwoFactor
      summary: Start TOTP enrollment
      description: |
        Returns the TOTP secret, its otpauth:// URI (QR-code source), and the
        backup codes — none of which are ever retrievable again. Enrollment
        stays pending, and login stays password-only, until the code is
        confirmed at `/v1/auth/2fa/confirm`. Calling this again while pending
        replaces the enrollment. Sudo-mode gated; no request body.
      tags: [auth]
      responses:
        "200":
          description: Pending enrollment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnrollment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      summary: Activate a pending TOTP enrollment
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code from the authenticator app.
      responses:
        "204":
          description: Two-factor is now enforced at login.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      summary: Disable two-factor authentication
      description: |
        Removes a confirmed enrollment or cancels a pending one. Sudo-mode
        gated; identity proof comes from the reauth window, so there is no
        request body.
      tags: [auth]
      responses:
        "204":
          description: Two-factor disabled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/backup-codes:
    post:
      operationId: regenerateBackupCodes
      summary: Regenerate backup codes
      description: |
        Replaces all existing backup codes, used and unused. Sudo-mode gated;
        no request body.
      tags: [auth]
      responses:
        "200":
          description: Fresh backup codes; the previous ones are dead.
          content:
            application/json:
              schema:
                type: object
                required: [backup_codes]
                properties:
                  backup_codes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users:
    get:
      operationId: listUsers
      summary: List all users
      description: Admin only. Every user of the instance, oldest first.
      tags: [users]
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      summary: Create a user
      description: |
        Admin only. Provisions a user with an initial password; there is no
        self-service signup or invitation email by design. `role` defaults
        to `member`.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}:
    patch:
      operationId: updateUser
      summary: Update a user's name or role
      description: |
        Admin only. Changing your own role is refused (`409`), as is
        demoting the last admin.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one property must be present.
              properties:
                name:
                  type: string
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: |
        Admin only. Deletes the user with their sessions and 2FA enrollment.
        Deleting yourself or the last admin is refused (`409`).
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      description: |
        Admin only. Sets a new password without the old one — the recovery
        path, since there is no email-based reset. Revokes every session of
        the user.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password reset; all of the user's sessions are revoked.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects:
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,62}$"
                display_name:
                  type: string
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      responses:
        "200":
          description: All projects, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        Updates the display name and/or the draft source mode. Switching
        the source mode is an explicit action with product consequences:
        `managed` documents are edited through the web/API, `file`
        documents are replaced by CLI/Git submissions.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                source_mode:
                  type: string
                  enum: [managed, file]
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        Destructive: removes the project with every environment, draft,
        and revision. Requires recent authentication (sudo mode).
      tags: [projects]
      responses:
        "204":
          description: Project deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{id}/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectDraft
      summary: Get the current draft document
      tags: [projects]
      responses:
        "200":
          description: The draft with its compiled definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: submitProjectDraft
      summary: Submit a draft document
      description: |
        Replaces the whole draft. The manifest is parsed, validated, and
        compiled before anything is stored; diagnostics are returned with
        source positions. `expected_version` is the optimistic concurrency
        token: it must match the stored draft version, and 0 is accepted
        only for the first submission.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: The manifest document text.
                format:
                  type: string
                  enum: [yaml, json]
                  default: yaml
                expected_version:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Draft accepted and advanced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Stale `expected_version` (`error.code = version_conflict`):
            fetch the draft and retry with its current version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidManifest" }

  /v1/projects/{id}/environments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createEnvironment
      summary: Create an environment
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,62}$"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listEnvironments
      summary: List environments of a project
      tags: [environments]
      responses:
        "200":
          description: The project's environments, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/environments/{id}/values:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listEnvironmentValues
      summary: List the current environment values
      description: |
        Names, secrecy, and versions of every current value. Plain values
        include their content; secret values are write-only and never
        return content.
      tags: [values]
      responses:
        "200":
          description: Current values, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [values]
                properties:
                  values:
                    type: array
                    items: { $ref: "#/components/schemas/ValueEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: submitEnvironmentValues
      summary: Stage candidate environment values
      description: |
        Submits one flat name-to-value map. Secrecy is declared by the
        manifest values block alone: the server separates plain from
        secret against the project's current draft definition and rejects
        undeclared names. Empty values follow the dotenv rule (empty =
        unset) and are dropped. The staged candidate changes nothing
        until a deployment promotes it; unpromoted candidates are
        garbage-collected.
      tags: [values]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: Candidate staged; secret values are not echoed.
          content:
            application/json:
              schema:
                type: object
                required: [candidate_id, plain, secret]
                properties:
                  candidate_id:
                    type: string
                    format: uuid
                  plain:
                    type: array
                    items: { type: string }
                  secret:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/environments/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRevisions
      summary: List the revisions of an environment
      tags: [revisions]
      responses:
        "200":
          description: Revision summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/revisions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRevision
      summary: Get a revision document
      description: |
        The complete immutable revision: canonical definition, resolved
        plain values, opaque secret references and versions, digest-pinned
        artifacts, and required capabilities. Secret plaintext never
        appears in a revision.
      tags: [revisions]
      responses:
        "200":
          description: The revision document.
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/environments/{id}/target:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironmentTarget
      summary: Get the environment's revision pointers
      description: |
        `target_revision_id` is where reconciliation is heading;
        `active_revision_id` is the last revision that passed its health
        conditions. A daemon restart never changes either pointer.
      tags: [revisions]
      responses:
        "200":
          description: The pointer pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setEnvironmentTarget
      summary: Roll back to an existing revision
      description: |
        Points the target at a previous revision of this environment.
        Rollback re-deploys the stored revision exactly; it never creates
        a new revision.
      tags: [revisions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Target moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/environments/{id}/runs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRuns
      summary: List the runs of an environment
      description: |
        Runs explain reconciliation but never drive it: this journal is
        read-only, bounded by retention caps, and deleting it would not
        change targets or recovery.
      tags: [runs]
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRun
      summary: Get a run tree
      description: |
        The run with its steps nested by parent and their attempts. Log
        bodies are fetched per step.
      tags: [runs]
      responses:
        "200":
          description: The run tree.
          content:
            application/json:
              schema:
                type: object
                required: [run, steps]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/Step" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/steps/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Composite cursor `attempt:seq`; entries after it are returned.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
    get:
      operationId: listStepLogs
      summary: Read step logs
      description: |
        One page of a step's log entries across attempts, ordered by
        (attempt, seq). `next` is the cursor of the last entry returned.
        Entries are redacted and bounded at write time.
      tags: [runs]
      responses:
        "200":
          description: Log entries after the cursor.
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  next:
                    type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/steps/{id}/logs/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Initial cursor when no Last-Event-ID header is sent.
    get:
      operationId: streamStepLogs
      summary: Stream step logs (SSE)
      description: |
        Server-sent events of `LogEntry` objects as they are committed.
        Each event's id is the composite cursor `attempt:seq`; reconnects
        resume via the standard `Last-Event-ID` header. A comment ping is
        sent every 15 seconds. This route is exempt from the request
        timeout.
      tags: [runs]
      responses:
        "200":
          description: An event stream (`text/event-stream`).
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/environments/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironmentStatus
      summary: Get an environment's topology and health projection
      description: |
        The per-service health, diagnostics, and pod topology of an
        environment, assembled from the maintained observed-state store and
        the database pointers. No request-time Kubernetes call is made;
        `observation.state` reports how fresh the underlying view is, and
        health is `unknown` until the observation cache has synchronized.
      tags: [status]
      responses:
        "200":
          description: The environment status projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/environments/{id}/status/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: streamEnvironmentStatus
      summary: Stream an environment's status projection (SSE)
      description: |
        Server-sent events carrying the full `EnvironmentStatus` document,
        re-sent (coalesced) whenever observation invalidates the
        environment's projection. A comment ping is sent every 15 seconds.
        The stream closes when the subscriber falls behind; clients simply
        reconnect. This route is exempt from the request timeout.
      tags: [status]
      responses:
        "200":
          description: An event stream (`text/event-stream`).
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/system/observation:
    get:
      operationId: getSystemObservation
      summary: Get the observation plane's structural health
      description: |
        Diagnostics of the observation machinery itself: connected or
        API-only mode, cache readiness, per-kind watch synchronization,
        source freshness, and reconcile queue depth.
      tags: [status]
      responses:
        "200":
          description: Observation plane diagnostics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemObservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEnvironment
      summary: Get an environment
      tags: [environments]
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment
      description: |
        Destructive: removes the environment with its values, revisions,
        and history. Requires recent authentication (sudo mode).
      tags: [environments]
      responses:
        "204":
          description: Environment deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from login / 2FA verify.

  responses:
    BadRequest:
      description: Malformed request body or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid token, wrong credentials, or wrong code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The caller is authenticated but lacks the admin role
        (`error.code = forbidden`), or — on sudo-mode-gated writes — recent
        authentication is required (`error.code = reauth_required`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The resource is in a state that does not allow the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts; retry after the window passes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReauthRequired:
      description: |
        Recent authentication required (`error.code = reauth_required`):
        the session's sudo-mode window has lapsed. Confirm identity at
        `/v1/auth/reauth` and retry the original request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidManifest:
      description: |
        The manifest failed validation or compilation
        (`error.code = invalid_manifest`). `diagnostics` lists every
        problem with its source position.
      content:
        application/json:
          schema:
            type: object
            required: [error, diagnostics]
            properties:
              error: { $ref: "#/components/schemas/ErrorDetail" }
              diagnostics:
                type: array
                items: { $ref: "#/components/schemas/Diagnostic" }
  schemas:
    Role:
      type: string
      description: |
        Instance-wide role. Admins additionally manage users and instance
        settings; members have full access to all projects.
      enum: [admin, member]

    User:
      type: object
      required: [id, email, name, role, two_factor_enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role: { $ref: "#/components/schemas/Role" }
        two_factor_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      description: A session as listed in session management; never carries the token.
      required: [id, expires_at, ip_address, user_agent, created_at, current]
      properties:
        id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session the request authenticated with.

    SessionCreated:
      type: object
      description: A freshly created session. The token is shown exactly once.
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer token; store it securely.
        expires_at:
          type: string
          format: date-time
        user: { $ref: "#/components/schemas/User" }

    SessionCreatedResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/SessionCreated" }

    Challenge:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Single-use challenge token for /v1/auth/2fa/verify.
        expires_at:
          type: string
          format: date-time

    ChallengeResponse:
      type: object
      required: [challenge]
      properties:
        challenge: { $ref: "#/components/schemas/Challenge" }

    TwoFactorEnrollment:
      type: object
      required: [secret, otpauth_uri, backup_codes]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret, for manual authenticator entry.
        otpauth_uri:
          type: string
          description: otpauth:// URI to render as a QR code.
        backup_codes:
          type: array
          items: { type: string }
          description: Single-use recovery codes; shown only once.

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - invalid_credentials
            - invalid_token
            - invalid_code
            - forbidden
            - reauth_required
            - not_found
            - conflict
            - version_conflict
            - invalid_manifest
            - rate_limited
            - node_unreachable
            - registry_disabled
            - registry_unavailable
            - internal
        message:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    Project:
      type: object
      required: [id, name, display_name, source_mode, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Stable identity; must match the manifest `name`.
        display_name:
          type: string
        source_mode:
          type: string
          enum: [managed, file]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectResponse:
      type: object
      required: [project]
      properties:
        project: { $ref: "#/components/schemas/Project" }

    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    EnvironmentResponse:
      type: object
      required: [environment]
      properties:
        environment: { $ref: "#/components/schemas/Environment" }

    Draft:
      type: object
      description: |
        The current editable definition document of a project together
        with its compiled, canonical form. `version` is the optimistic
        concurrency token for submissions.
      required: [version, format, source, hash, definition]
      properties:
        version:
          type: integer
          format: int64
        format:
          type: string
          enum: [yaml, json]
        source:
          type: string
          description: The manifest document text as last submitted.
        hash:
          type: string
          description: Content hash of the compiled canonical definition.
        definition:
          type: object
          description: The compiled, target-independent project definition.

    DraftResponse:
      type: object
      required: [draft]
      properties:
        draft: { $ref: "#/components/schemas/Draft" }

    Run:
      type: object
      required: [id, kind, project_id, environment_id, actor, status,
                 created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        project_id:
          type: [string, "null"]
          format: uuid
        environment_id:
          type: [string, "null"]
          format: uuid
        actor:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    Step:
      type: object
      required: [id, key, title, status, created_at, started_at,
                 finished_at, attempts]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Deterministic step identity within the run.
        title:
          type: string
        status:
          type: string
          enum: [pending, waiting, running, succeeded, failed, skipped, cancelled]
        progress_current:
          type: integer
          format: int64
        progress_total:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        attempts:
          type: array
          items: { $ref: "#/components/schemas/Attempt" }
        children:
          type: array
          items: { $ref: "#/components/schemas/Step" }

    Attempt:
      type: object
      required: [id, number, status, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    LogEntry:
      type: object
      description: One redacted, bounded step-log entry.
      required: [attempt, seq, ts, level, message, fields]
      properties:
        attempt:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        fields:
          type: object

    RevisionSummary:
      type: object
      required: [id, project_id, environment_id, schema_version, checksum,
                 definition_hash, values_hash, compiler_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        schema_version:
          type: string
        checksum:
          type: string
        definition_hash:
          type: string
        values_hash:
          type: string
        compiler_version:
          type: string
        created_at:
          type: string
          format: date-time

    TargetResponse:
      type: object
      required: [target]
      properties:
        target:
          type: object
          required: [target_revision_id, active_revision_id, updated_at]
          properties:
            target_revision_id:
              type: [string, "null"]
              format: uuid
            active_revision_id:
              type: [string, "null"]
              format: uuid
            updated_at:
              type: string
              format: date-time

    Observation:
      type: object
      description: |
        The freshness of the observed-state source feeding a projection.
        Anything but `fresh` means health is reported as `unknown` rather
        than guessed from a stale view.
      required: [state]
      properties:
        state:
          type: string
          enum: [fresh, stale, unknown]
        stale_since:
          type: [string, "null"]
          format: date-time
        last_sync:
          type: [string, "null"]
          format: date-time

    HealthDiagnostic:
      type: object
      description: One structured health observation.
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [info, warning, error]
        code:
          type: string
        message:
          type: string
        resource:
          type: string

    PodStatus:
      type: object
      required: [name, node, phase, ready, restarts]
      properties:
        name:
          type: string
        node:
          type: string
        phase:
          type: string
        ready:
          type: boolean
        restarts:
          type: integer
        reason:
          type: string
        started_at:
          type: [string, "null"]
          format: date-time

    ServiceStatus:
      type: object
      required: [key, type, health, diagnostics, pods]
      properties:
        key:
          type: string
        type:
          type: string
        health:
          type: string
          enum: [unknown, progressing, healthy, degraded, unhealthy]
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/HealthDiagnostic" }
        pods:
          type: array
          items: { $ref: "#/components/schemas/PodStatus" }

    EnvironmentStatus:
      type: object
      required: [environment_id, target_revision, active_revision, observation, services]
      properties:
        environment_id:
          type: string
          format: uuid
        target_revision:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RevisionRef"
        active_revision:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RevisionRef"
        observation: { $ref: "#/components/schemas/Observation" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceStatus" }

    RevisionRef:
      type: object
      required: [id, checksum]
      properties:
        id:
          type: string
          format: uuid
        checksum:
          type: string

    SystemObservation:
      type: object
      required: [mode, ready, observation, kinds, queue_depth, workers]
      properties:
        mode:
          type: string
          enum: [connected, api-only]
        ready:
          type: boolean
        observation: { $ref: "#/components/schemas/Observation" }
        kinds:
          type: array
          items:
            type: object
            required: [kind, synced]
            properties:
              kind:
                type: string
              synced:
                type: boolean
        queue_depth:
          type: integer
        workers:
          type: integer

    ValueEntry:
      type: object
      description: |
        One current environment value. `value` is present for plain
        entries only; secret entries carry name and version alone.
      required: [name, secret, version]
      properties:
        name:
          type: string
        secret:
          type: boolean
        version:
          type: integer
          format: int64
        value:
          type: string

    Diagnostic:
      type: object
      description: One manifest problem with its source position.
      required: [file, path, line, column, message]
      properties:
        file:
          type: string
        path:
          type: string
          description: Dotted document path, e.g. `applications.api.image`.
        line:
          type: integer
        column:
          type: integer
        message:
          type: string
