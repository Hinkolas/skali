openapi: 3.1.0
info:
  title: skali API
  description: |
    Client-facing API of skali. Authentication is email+password with
    optional TOTP two-factor; sessions are opaque bearer tokens. The same
    API serves every client: the web BFF, the `skali` CLI, and future
    native apps.

    There is no registration endpoint: users are created by an instance
    admin (`/v1/users`) or by the server operator (`skalid user create`).
    Every user carries an instance-wide role — `admin` (additionally
    manages users and instance settings) or `member` — checked per
    request. All error responses share the `Error` envelope; clients
    should branch on `error.code`, not on messages.

    Security-critical operations sit behind sudo mode: they require the
    session to have proven the user's identity recently (within the
    operator-configured reauth window). A stale session receives
    `403 reauth_required`; clients recover by confirming identity at
    `/v1/auth/reauth` and retrying the original request.
  version: 0.1.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Same host the spec is served from.

security:
  - bearerAuth: []

paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a `session` when the user has no second factor, or a
        `challenge` when 2FA is enabled — exchange it with a code at
        `/v1/auth/2fa/verify` within its expiry. Exactly one of the two
        properties is present.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
      responses:
        "200":
          description: Password accepted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionCreatedResponse"
                  - $ref: "#/components/schemas/ChallengeResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Complete a 2FA login
      description: |
        Exchanges a login challenge plus a 6-digit TOTP code — or a backup
        code — for a session. Challenges are single-use, expire after a few
        minutes, and are deleted after 5 failed codes.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or a backup code.
      responses:
        "200":
          description: Second factor accepted; session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreatedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [auth]
      responses:
        "204":
          description: Session revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the authenticated user and session
      tags: [auth]
      responses:
        "200":
          description: The caller's user and session.
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags: [auth]
      responses:
        "200":
          description: All unexpired sessions of the caller, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/reauth:
    post:
      operationId: reauthenticate
      summary: Confirm identity for sudo mode
      description: |
        Re-proves the caller's identity and refreshes the current session's
        sudo-mode window; other sessions of the same user are unaffected.
        Factor policy: accounts with confirmed two-factor present a TOTP or
        backup code (`code`; the code is consumed), all others present their
        `password`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        "204":
          description: Identity confirmed; the session is fresh again.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: |
        Revokes every other session; only the requesting one survives.
        Sudo-mode gated; additionally requires the current password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }

  /v1/auth/2fa/enable:
    post:
      operationId: enableTwoFactor
      summary: Start TOTP enrollment
      description: |
        Returns the TOTP secret, its otpauth:// URI (QR-code source), and the
        backup codes — none of which are ever retrievable again. Enrollment
        stays pending, and login stays password-only, until the code is
        confirmed at `/v1/auth/2fa/confirm`. Calling this again while pending
        replaces the enrollment. Sudo-mode gated; no request body.
      tags: [auth]
      responses:
        "200":
          description: Pending enrollment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnrollment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      summary: Activate a pending TOTP enrollment
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code from the authenticator app.
      responses:
        "204":
          description: Two-factor is now enforced at login.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      summary: Disable two-factor authentication
      description: |
        Removes a confirmed enrollment or cancels a pending one. Sudo-mode
        gated; identity proof comes from the reauth window, so there is no
        request body.
      tags: [auth]
      responses:
        "204":
          description: Two-factor disabled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/2fa/backup-codes:
    post:
      operationId: regenerateBackupCodes
      summary: Regenerate backup codes
      description: |
        Replaces all existing backup codes, used and unused. Sudo-mode gated;
        no request body.
      tags: [auth]
      responses:
        "200":
          description: Fresh backup codes; the previous ones are dead.
          content:
            application/json:
              schema:
                type: object
                required: [backup_codes]
                properties:
                  backup_codes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ReauthRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users:
    get:
      operationId: listUsers
      summary: List all users
      description: Admin only. Every user of the instance, oldest first.
      tags: [users]
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      summary: Create a user
      description: |
        Admin only. Provisions a user with an initial password; there is no
        self-service signup or invitation email by design. `role` defaults
        to `member`.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}:
    patch:
      operationId: updateUser
      summary: Update a user's name or role
      description: |
        Admin only. Changing your own role is refused (`409`), as is
        demoting the last admin.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one property must be present.
              properties:
                name:
                  type: string
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: |
        Admin only. Deletes the user with their sessions and 2FA enrollment.
        Deleting yourself or the last admin is refused (`409`).
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password
      description: |
        Admin only. Sets a new password without the old one — the recovery
        path, since there is no email-based reset. Revokes every session of
        the user.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password reset; all of the user's sessions are revoked.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/nodes:
    get:
      operationId: listNodes
      summary: List cluster nodes
      description: |
        Admin only. Every node of the cluster, oldest first — including the
        master's own row. `status` is derived from heartbeats (a node flips
        `offline` after missing them for the staleness window).
      tags: [nodes]
      responses:
        "200":
          description: All nodes.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/nodes/tokens:
    post:
      operationId: createJoinToken
      summary: Mint a one-time node join token
      description: |
        Admin only, sudo mode. Creates a single-use enrollment token (valid
        for one hour) and the ready-to-paste `skalid enroll` command for the
        new machine. The token embeds a fingerprint of the cluster CA, so
        the enrolling node can authenticate the master before trusting it.
        Requires `CLUSTER_ADDR` to be configured on the master (`409`).
        The token is shown exactly once.
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  description: Roles granted at enrollment. Defaults to `[worker]`.
                  items:
                    type: string
                    enum: [edge, worker, builder]
      responses:
        "201":
          description: Join token created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinTokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/nodes/{id}/metrics:
    get:
      operationId: listNodeMetrics
      summary: Node metrics history
      description: |
        Admin only. The node's resource history over the last 24 hours,
        averaged into 2-minute buckets (at most 720 samples). Buckets in which
        the node reported nothing are absent — offline windows appear as gaps,
        never as zeros.
      tags: [nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bucketed metrics history, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [samples]
                properties:
                  samples:
                    type: array
                    items: { $ref: "#/components/schemas/NodeMetricsSample" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/nodes/{id}:
    patch:
      operationId: updateNode
      summary: Update a node's name, roles, or public address
      description: |
        Admin only, sudo mode. The `master` role is fixed — it can be
        neither granted nor removed (`409`). Setting `public_addr` to an
        empty string clears it.
      tags: [nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one property must be present.
              properties:
                name:
                  type: string
                roles:
                  type: array
                  items: { $ref: "#/components/schemas/NodeRole" }
                public_addr:
                  type: string
                  description: Where public DNS points for this node (edge role). Empty string clears it.
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema:
                type: object
                required: [node]
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteNode
      summary: Remove a node from the cluster
      description: |
        Admin only, sudo mode. Deletes the node row and implicitly revokes
        the node's certificate (its serial no longer matches any node). The
        machine keeps running but is orphaned; re-adding it requires a fresh
        join token. The master node cannot be removed (`409`).
      tags: [nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Node removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/containers:
    get:
      operationId: listContainers
      summary: List containers across the cluster
      description: |
        Admin only. Every skali-managed container as last observed by the
        master (heartbeat cadence, ~15s; mutations through this API reflect
        immediately), sorted by node then name. Containers that disappeared
        from a node keep a `gone` row for up to an hour, then vanish.

        This whole surface is a low-level admin escape hatch; the typed
        resource APIs (applications, databases) are the product surface.
      tags: [containers]
      parameters:
        - name: node
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Narrow to one node. Unknown node ids are a `404`.
      responses:
        "200":
          description: Observed containers, sorted by node then name.
          content:
            application/json:
              schema:
                type: object
                required: [containers]
                properties:
                  containers:
                    type: array
                    items: { $ref: "#/components/schemas/Container" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/images:
    get:
      operationId: listImages
      summary: List images across the cluster
      description: |
        Admin only. Every image on every node as last observed by the master
        — unfiltered (skali-managed or not: this is whole-cluster disk
        visibility), sorted largest first. `containers` counts references
        from containers in any state; `0` means unused.
      tags: [containers]
      parameters:
        - name: node
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Narrow to one node. Unknown node ids are a `404`.
      responses:
        "200":
          description: Observed images, largest first.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items: { $ref: "#/components/schemas/NodeImage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/volumes:
    get:
      operationId: listVolumes
      summary: List volumes across the cluster
      description: |
        Admin only. Every named volume on every node as last observed by the
        master (anonymous volumes included), sorted by node then name. No
        sizes — computing them walks the volume filesystems, far too
        expensive to sample continuously.
      tags: [containers]
      parameters:
        - name: node
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Narrow to one node. Unknown node ids are a `404`.
      responses:
        "200":
          description: Observed volumes, sorted by node then name.
          content:
            application/json:
              schema:
                type: object
                required: [volumes]
                properties:
                  volumes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeVolume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/registry/images:
    get:
      operationId: listRegistryImages
      summary: List the mirror catalog
      description: |
        Admin only. Images the master imported into the cluster registry,
        digest-pinned from upstream — the authoritative record of what the
        mirror serves (the master is its only writer). Answers
        `503 registry_disabled` when the master runs no registry
        (`CLUSTER_ADDR` unset).
      tags: [registry]
      responses:
        "200":
          description: The catalog, sorted by repository then tag.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items: { $ref: "#/components/schemas/RegistryImage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }
    post:
      operationId: importRegistryImage
      summary: Import an image into the mirror
      description: |
        Admin only, sudo mode. Copies the upstream image into the cluster
        registry digest-pinned, multi-arch index preserved, registry to
        registry — the master's engine is not involved and only the master
        needs public egress. Tag references only: the catalog pins
        `(repository, tag)` to a digest; re-importing a tag moves the pin.
        The mirrored repository is `mirror/<upstream-host>/<path>`, so
        `postgres:17` lands at
        `<registry>/mirror/docker.io/library/postgres:17`. The copy can take
        minutes, so it runs as a background operation: bad references fail
        here with a 400, everything else answers `202` with an operation to
        poll — on success its `result` carries the catalog entry under
        `image`.
      tags: [registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
                  description: Upstream tag reference, e.g. `postgres:17`.
      responses:
        "202":
          description: Import started; poll the operation.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }

  /v1/registry/images/{id}:
    delete:
      operationId: deleteRegistryImage
      summary: Remove an image from the mirror
      description: |
        Admin only, sudo mode. Deletes the catalog entry and its manifest
        from the registry (nodes can no longer pull it). Disk is not freed
        yet — blob garbage collection is a later milestone. Two tags pinning
        the same digest share a manifest; deleting either removes it for
        both.
      tags: [registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }

  /v1/operations:
    get:
      operationId: listOperations
      summary: List recent operations
      description: |
        Admin only. Task-shaped background work kicked off by user requests
        (registry imports today): the read side of every `202`. Newest
        first, capped at 100; finished operations are pruned after a day.
      tags: [operations]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Filter by kind, e.g. `registry_import`.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, succeeded, failed]
      responses:
        "200":
          description: Recent operations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/operations/{id}:
    get:
      operationId: getOperation
      summary: Get one operation
      description: Admin only. Poll here after a `202` until `status` leaves `running`.
      tags: [operations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workloads:
    get:
      operationId: listWorkloads
      summary: List workloads
      description: |
        Admin only. Desired state with live convergence status: every
        workload embeds its assignments (per-replica phase, node, errors,
        retry schedule). Reads stay available on a registry-less master.
      tags: [workloads]
      responses:
        "200":
          description: All workloads, by name.
          content:
            application/json:
              schema:
                type: object
                required: [workloads]
                properties:
                  workloads:
                    type: array
                    items: { $ref: "#/components/schemas/Workload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createWorkload
      summary: Create a workload
      description: |
        Admin only, sudo mode. Declares desired state and returns
        immediately — the reconciler imports the image into the mirror
        (digest-pinned), assigns nodes within the constraints, pulls, and
        starts the replicas in the background. Progress is read back from
        the workload's `status` and its assignments. Requires the mirror
        (`503 registry_disabled` without `CLUSTER_ADDR`). Replicas defaults
        to 1.
      tags: [workloads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadCreateRequest" }
      responses:
        "201":
          description: Declared; convergence starts in the background.
          content:
            application/json:
              schema:
                type: object
                required: [workload]
                properties:
                  workload: { $ref: "#/components/schemas/Workload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }

  /v1/workloads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getWorkload
      summary: Get one workload
      tags: [workloads]
      responses:
        "200":
          description: The workload with its assignments.
          content:
            application/json:
              schema:
                type: object
                required: [workload]
                properties:
                  workload: { $ref: "#/components/schemas/Workload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkload
      summary: Update a workload
      description: |
        Admin only, sudo mode. Partial update: absent fields keep their
        value; `spec` and `constraints` replace as whole objects. Every
        update bumps `generation` and the reconciler replaces or adjusts
        replicas to match. Changing `image` re-resolves the digest pin;
        `desired_state` accepts `running` or `stopped`. A deleting workload
        answers `409`.
      tags: [workloads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadUpdateRequest" }
      responses:
        "200":
          description: Updated; convergence continues in the background.
          content:
            application/json:
              schema:
                type: object
                required: [workload]
                properties:
                  workload: { $ref: "#/components/schemas/Workload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }
    delete:
      operationId: deleteWorkload
      summary: Delete a workload
      description: |
        Admin only, sudo mode. Marks the workload deleting and answers
        `202`: the reconciler removes every replica, then the rows
        disappear. An offline node blocks completion visibly on its
        assignment; removing that node completes the teardown.
      tags: [workloads]
      responses:
        "202":
          description: Teardown started; poll the workload until it 404s.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from login / 2FA verify.

  responses:
    BadRequest:
      description: Malformed request body or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid token, wrong credentials, or wrong code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The caller is authenticated but lacks the admin role
        (`error.code = forbidden`), or — on sudo-mode-gated writes — recent
        authentication is required (`error.code = reauth_required`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist or belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The resource is in a state that does not allow the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts; retry after the window passes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReauthRequired:
      description: |
        Recent authentication required (`error.code = reauth_required`):
        the session's sudo-mode window has lapsed. Confirm identity at
        `/v1/auth/reauth` and retry the original request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NodeUnreachable:
      description: |
        The node (or its container engine) could not be reached
        (`error.code = node_unreachable`). The cluster state is unchanged;
        retry once the node is back.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegistryUnavailable:
      description: |
        The cluster registry cannot serve the request: the master runs no
        registry (`error.code = registry_disabled`, set `CLUSTER_ADDR`), or
        the registry container is unreachable
        (`error.code = registry_unavailable`, it may still be starting).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Role:
      type: string
      description: |
        Instance-wide role. Admins additionally manage users and instance
        settings; members have full access to all projects.
      enum: [admin, member]

    User:
      type: object
      required: [id, email, name, role, two_factor_enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role: { $ref: "#/components/schemas/Role" }
        two_factor_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    NodeRole:
      type: string
      description: |
        A node's responsibilities. `master` runs the control plane (one per
        cluster, assigned at boot, immutable); `edge` terminates public
        ingress; `worker` runs application containers; `builder` builds
        images.
      enum: [master, edge, worker, builder]

    Node:
      type: object
      required: [id, name, roles, advertise_addr, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          items: { $ref: "#/components/schemas/NodeRole" }
        advertise_addr:
          type: string
          description: host:port the master dials on the private network.
        public_addr:
          type: [string, "null"]
          description: Where public DNS points (edge role); operator-set.
        arch:
          type: [string, "null"]
          description: Reported by heartbeat (e.g. amd64, arm64).
        os:
          type: [string, "null"]
        skalid_version:
          type: [string, "null"]
        status:
          type: string
          enum: [online, offline]
        last_seen:
          type: [string, "null"]
          format: date-time
        metrics:
          oneOf:
            - { $ref: "#/components/schemas/NodeMetrics" }
            - type: "null"
          description: Latest resource snapshot; null until the node first reports.
        engine:
          type: object
          description: |
            At-a-glance engine counts (containers exclude `gone`
            breadcrumbs). Present on the list endpoint only.
          required: [containers, images, volumes]
          properties:
            containers: { type: integer }
            images: { type: integer }
            volumes: { type: integer }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NodeMetrics:
      type: object
      description: |
        A node resource snapshot. Rates are bytes/second; `cpu_pct` is 0–100
        normalized across effective cores (the cgroup quota when the node runs
        in a limited container); `load1` is the host-wide 1-minute load average.
      required:
        [cpu_pct, mem_used, mem_total, disk_used, disk_total,
         net_rx_rate, net_tx_rate, disk_read_rate, disk_write_rate, load1]
      properties:
        cpu_pct: { type: number }
        mem_used: { type: integer }
        mem_total: { type: integer }
        disk_used: { type: integer }
        disk_total: { type: integer }
        net_rx_rate: { type: integer }
        net_tx_rate: { type: integer }
        disk_read_rate: { type: integer }
        disk_write_rate: { type: integer }
        load1: { type: number }

    NodeMetricsSample:
      allOf:
        - { $ref: "#/components/schemas/NodeMetrics" }
        - type: object
          required: [sampled_at]
          properties:
            sampled_at:
              type: string
              format: date-time
              description: Bucket timestamp (~8-minute averages).

    ContainerKind:
      type: string
      description: |
        How skali manages a container. `application` instances belong to a
        project; a `database` container is an engine pool that may host
        logical databases of many projects; `system` containers are skali's
        own infrastructure (proxy, registry, ...).
      enum: [application, database, system]

    Container:
      type: object
      description: One observed skali-managed container on a node.
      required:
        [id, node_id, node_name, name, image, kind, state, health, exit_code,
         restart_count, labels, stats, created_at, started_at, first_seen,
         last_seen]
      properties:
        id:
          type: string
          description: Engine container id.
        node_id:
          type: string
          format: uuid
          description: The node the container runs on.
        node_name:
          type: string
        name:
          type: string
        image:
          type: string
        kind: { $ref: "#/components/schemas/ContainerKind" }
        state:
          type: string
          description: |
            Engine-reported state, plus `gone` for containers that vanished
            from the node's reports (kept briefly for visibility).
          enum: [created, running, paused, restarting, removing, exited, dead, gone]
        health:
          type: [string, "null"]
          description: Healthcheck state; null when none is configured.
          enum: [starting, healthy, unhealthy, null]
        exit_code:
          type: [integer, "null"]
        restart_count:
          type: integer
        labels:
          type: object
          additionalProperties: { type: string }
          description: Full label map including the skali.* identity labels.
        stats:
          oneOf:
            - { $ref: "#/components/schemas/ContainerStats" }
            - type: "null"
          description: Latest stats; null until the node has sampled twice.
        created_at:
          type: [string, "null"]
          format: date-time
          description: The container's own creation time on the engine.
        started_at:
          type: [string, "null"]
          format: date-time
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    ContainerStats:
      type: object
      description: |
        Per-container resource snapshot. `cpu_pct` uses docker-stats
        semantics — 100 means one full core, so values can exceed 100 on
        multi-core containers. Rates are bytes/second.
      required: [cpu_pct, mem_used, mem_limit, net_rx_rate, net_tx_rate]
      properties:
        cpu_pct: { type: number }
        mem_used: { type: integer }
        mem_limit:
          type: integer
          description: As reported by the engine; the host total when unlimited.
        net_rx_rate: { type: integer }
        net_tx_rate: { type: integer }

    NodeImage:
      type: object
      description: |
        One image observed on a node. Unfiltered inventory: every image on
        the machine, skali-managed or not.
      required:
        [id, node_id, node_name, repo_tags, repo_digests, size_bytes,
         dangling, containers, created_at, first_seen, last_seen]
      properties:
        id:
          type: string
          description: Content-addressable image id (`sha256:…`).
        node_id:
          type: string
          format: uuid
          description: The node the image sits on.
        node_name:
          type: string
        repo_tags:
          type: array
          items: { type: string }
          description: Empty for dangling images.
        repo_digests:
          type: array
          items: { type: string }
        size_bytes:
          type: integer
        dangling:
          type: boolean
        containers:
          type: integer
          description: Containers referencing the image, any state; 0 = unused.
        created_at:
          type: [string, "null"]
          format: date-time
          description: The image's own build time; null when unknown.
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    NodeVolume:
      type: object
      description: |
        One named volume observed on a node (anonymous volumes included).
        No size — computing it walks the volume's filesystem.
      required:
        [name, node_id, node_name, driver, scope, mountpoint, labels,
         containers, created_at, first_seen, last_seen]
      properties:
        name:
          type: string
        node_id:
          type: string
          format: uuid
          description: The node the volume lives on.
        node_name:
          type: string
        driver:
          type: string
        scope:
          type: string
          enum: [local, global]
        mountpoint:
          type: string
          description: Node-local storage path.
        labels:
          type: object
          additionalProperties: { type: string }
        containers:
          type: integer
          description: Containers mounting the volume, any state; 0 = unused.
        created_at:
          type: [string, "null"]
          format: date-time
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    RegistryImage:
      type: object
      description: |
        One mirror catalog entry: an upstream tag the master imported into
        the cluster registry, pinned to the digest it had at import time.
        Nodes pull it as `<registry>/<repository>:<tag>`.
      required:
        [id, repository, tag, digest, size_bytes, imported_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        repository:
          type: string
          description: Mirror-relative, e.g. `mirror/docker.io/library/postgres`.
        tag:
          type: string
        digest:
          type: string
          description: The pinned upstream manifest/index digest (`sha256:…`).
        size_bytes:
          type: integer
          description: Unique blob bytes across the whole (multi-arch) index.
        imported_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Advances when a re-import moves the pin.

    Operation:
      type: object
      description: |
        One task-shaped background job. Runs in-process on the master under
        a deadline; a master restart mid-flight surfaces as `failed` once
        the deadline passes.
      required: [id, kind, status, subject, result, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: What the operation does, e.g. `registry_import`.
        status:
          type: string
          enum: [running, succeeded, failed]
        subject:
          type: string
          description: Kind-specific, e.g. the upstream reference imported.
        result:
          type: object
          description: Kind-specific success payload; `{}` until then.
        error:
          type: string
          description: Present when failed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: Present once the operation leaves `running`.

    Workload:
      type: object
      description: |
        Desired state for one container spec running as N replicas, plus its
        live convergence status. `image` is the upstream reference the user
        declared; `image_repository`/`image_digest` are the mirror pin the
        replicas actually run — owned by the workload, so a re-import that
        moves the catalog pin never restarts containers behind your back.
      required:
        [id, name, kind, desired_state, replicas, constraints, image, spec,
         generation, status, created_at, updated_at, assignments]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Also the container name stem (`<name>-<ordinal>`).
        kind:
          type: string
          enum: [application, database]
        desired_state:
          type: string
          enum: [running, stopped, deleting]
        replicas:
          type: integer
        constraints: { $ref: "#/components/schemas/WorkloadConstraints" }
        image:
          type: string
          description: Upstream tag reference, e.g. `postgres:17`.
        spec: { $ref: "#/components/schemas/WorkloadSpec" }
        generation:
          type: integer
          description: Bumps on every update; assignments report the generation they converged to.
        status:
          type: string
          enum: [running, stopped, converging, importing, degraded, deleting]
          description: |
            Computed rollup: `deleting` > `degraded` (any error or
            unschedulable replica) > `importing` (no digest pin yet) >
            `converging` (work in flight or generation lag) > the desired
            state.
        image_repository:
          type: string
          description: Mirror-relative repository of the pin.
        image_digest:
          type: string
          description: The digest the replicas run.
        last_error:
          type: string
          description: Workload-level failure (image resolution), if any.
        next_attempt_at:
          type: string
          format: date-time
          description: When the failed step retries.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assignments:
          type: array
          items: { $ref: "#/components/schemas/WorkloadAssignment" }

    WorkloadAssignment:
      type: object
      description: |
        One replica slot, placed and converged by the reconciler. There is
        no error phase — an error is `last_error` (+ `next_attempt_at`) on
        whatever phase is stuck.
      required: [ordinal, phase, container_name, generation, retries, updated_at]
      properties:
        ordinal:
          type: integer
        node_id:
          type: string
          format: uuid
          description: Reconciler-assigned; absent while unplaced.
        node_name:
          type: string
        phase:
          type: string
          enum: [pending, unschedulable, pulling, deploying, stopping, ready, stopped, removing]
        container_name:
          type: string
        container_id:
          type: string
        generation:
          type: integer
        retries:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time

    WorkloadConstraints:
      type: object
      description: |
        Narrows where replicas may land; both filters intersect, empty means
        any node. Placement itself is reconciler-owned — pin nodes through
        `node_ids` if you must, the assignment stays an output.
      properties:
        node_ids:
          type: array
          items:
            type: string
            format: uuid
        node_roles:
          type: array
          items:
            type: string
            enum: [master, edge, worker, builder]

    WorkloadSpec:
      type: object
      description: |
        The container spec subset of a workload. Name, image, and placement
        live on the workload itself; identity labels (`skali.*`) are stamped
        by the reconciler and rejected here.
      properties:
        env:
          type: object
          additionalProperties: { type: string }
        command:
          type: array
          items: { type: string }
          description: Overrides the image CMD.
        ports:
          type: array
          items:
            type: object
            required: [container_port]
            properties:
              host_ip: { type: string }
              host_port:
                type: integer
                description: 0 = engine-assigned ephemeral port.
              container_port: { type: integer }
              protocol:
                type: string
                enum: [tcp, udp]
        mounts:
          type: array
          items:
            type: object
            required: [type, source, target]
            properties:
              type:
                type: string
                enum: [bind, volume]
              source: { type: string }
              target: { type: string }
              read_only: { type: boolean }
        restart_policy:
          type: string
          enum: [no, always, unless-stopped, on-failure]
          description: Defaults to `unless-stopped` — crash recovery is the node's job.
        restart_max_retries:
          type: integer
          description: on-failure only.
        cpus:
          type: number
          description: Cores per replica (0.5 = half a core); 0 = unlimited.
        memory_limit:
          type: integer
          description: Bytes; 0 = unlimited.
        networks:
          type: array
          items: { type: string }
          description: Existing network names to attach.
        labels:
          type: object
          additionalProperties: { type: string }
          description: User labels; the `skali.` prefix is reserved.
        healthcheck:
          type: object
          required: [test]
          properties:
            test:
              type: array
              items: { type: string }
              description: CMD/CMD-SHELL form, docker semantics.
            interval_seconds: { type: integer }
            timeout_seconds: { type: integer }
            start_period_seconds: { type: integer }
            retries: { type: integer }

    WorkloadCreateRequest:
      type: object
      required: [name, kind, image]
      properties:
        name:
          type: string
          description: "`^[a-z0-9][a-z0-9-]{0,53}$`; immutable."
        kind:
          type: string
          enum: [application, database]
        image:
          type: string
          description: Upstream tag reference; digest references are rejected.
        replicas:
          type: integer
          description: Defaults to 1; 0 is legal (converges to nothing).
        desired_state:
          type: string
          enum: [running, stopped]
        constraints: { $ref: "#/components/schemas/WorkloadConstraints" }
        spec: { $ref: "#/components/schemas/WorkloadSpec" }

    WorkloadUpdateRequest:
      type: object
      description: |
        Partial: absent fields keep their value; `spec` and `constraints`
        replace as whole objects.
      properties:
        image:
          type: string
        replicas:
          type: integer
        desired_state:
          type: string
          enum: [running, stopped]
        constraints: { $ref: "#/components/schemas/WorkloadConstraints" }
        spec: { $ref: "#/components/schemas/WorkloadSpec" }

    JoinTokenCreated:
      type: object
      description: A freshly minted join token. Shown exactly once.
      required: [token, expires_at, enroll_command]
      properties:
        token:
          type: string
          description: One-time enrollment secret, `<id>.<secret>.<ca-fingerprint>`.
        expires_at:
          type: string
          format: date-time
        enroll_command:
          type: string
          description: Ready-to-paste command for the new machine.

    Session:
      type: object
      description: A session as listed in session management; never carries the token.
      required: [id, expires_at, ip_address, user_agent, created_at, current]
      properties:
        id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session the request authenticated with.

    SessionCreated:
      type: object
      description: A freshly created session. The token is shown exactly once.
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer token; store it securely.
        expires_at:
          type: string
          format: date-time
        user: { $ref: "#/components/schemas/User" }

    SessionCreatedResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/SessionCreated" }

    Challenge:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Single-use challenge token for /v1/auth/2fa/verify.
        expires_at:
          type: string
          format: date-time

    ChallengeResponse:
      type: object
      required: [challenge]
      properties:
        challenge: { $ref: "#/components/schemas/Challenge" }

    TwoFactorEnrollment:
      type: object
      required: [secret, otpauth_uri, backup_codes]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret, for manual authenticator entry.
        otpauth_uri:
          type: string
          description: otpauth:// URI to render as a QR code.
        backup_codes:
          type: array
          items: { type: string }
          description: Single-use recovery codes; shown only once.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - invalid_credentials
                - invalid_token
                - invalid_code
                - forbidden
                - reauth_required
                - not_found
                - conflict
                - rate_limited
                - node_unreachable
                - registry_disabled
                - registry_unavailable
                - internal
            message:
              type: string
