# Second Lima VM for the skali cluster end-to-end suite: the host that
# joins the skali-e2e server, first as an additional k3s server (etcd
# pair) and later as an agent. Smaller than the server VM, but sized for
# a temporary control plane with etcd.
# Create with `task lima:up`, run with `task test:cluster`.
minimumLimaVersion: "1.0.0"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

vmType: "vz"
cpus: 2
memory: "4GiB"
disk: "15GiB"

# A fresh production host exposes nothing of the developer machine.
mounts: []

# Same shared network as the server template; see the note there.
networks:
  - lima: user-v2

containerd:
  system: false
  user: false
